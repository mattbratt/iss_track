<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>ISS Tracker</title>
  <!-- Preload libraries and images to fetch them early, improving initial render speed -->
  <script src="astronomy.browser.js" defer></script>
  <link rel="preload" href="images/mapday.jpg" as="image">
  <link rel="preload" href="images/mapnight.jpg" as="image">
  <link rel="preload" href="images/iss_tiny.png" as="image">
  <link rel="preload" href="images/sun_128.png" as="image">
  <link rel="preload" href="images/moon_128.png" as="image">

  <style>
    @font-face {
      font-family: 'Roboto Condensed';
      src: url('fonts/RobotoCondensed-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'Roboto Condensed';
      src: url('fonts/RobotoCondensed-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
    }
    body {
      font-family: 'Roboto Condensed', Arial, sans-serif;
      /* Keep your existing styles */
      background: #444;
      color: #fff;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      position: relative;
    }
    #tracker-container {
      width: 100%;
      max-width: 1000px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    #earthCanvas {
      border: 1px solid #666;
      display: block;
      width: 100%;
      max-width: 1000px;
      background: #222;
      height: auto;
      aspect-ratio: 2 / 1;
    }
    :fullscreen #tracker-container {
      max-width: none;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: #000;
    }
    :fullscreen #earthCanvas {
      margin: 0;
      width: 100%;
      height: auto;
      max-width: none;
      max-height: none;
      border: none;
    }
    #info-panel {
      background-color: #00549F;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 10px;
      box-sizing: border-box;
      position: relative;
    }
    #primary-data {
      display: flex;
      justify-content: space-around;
      width: 100%;
      flex-grow: 1;
      align-items: center;
      flex-wrap: wrap;
    }
    .data-section {
      margin: 0 5px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    .data-label {
      font-size: clamp(0.7rem, 2vw, 0.8rem);
      color: rgba(255, 255, 255, 0.7);
      font-weight: normal;
      white-space: nowrap;
    }
    .data-value {
      font-size: clamp(0.5rem, 2.9vw, 1.1rem);
      font-weight: bold;
      white-space: nowrap;
    }
    #units-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 4px;
    }
    #units-label {
      margin-bottom: 4px;
      font-size: clamp(0.7rem, 2vw, 0.9rem);
      color: rgba(255, 255, 255, 0.7);
      white-space: nowrap;
      position: relative;
    }
    #units-toggle {
      cursor: pointer;
      width: 50px;
      height: 25px;
      border-radius: 100pt;
      border: 2px solid rgba(255, 255, 255, 0.5);
      position: relative;
      display: flex;
      align-items: center;
    }
    #units-toggle div {
      height: 25px;
      width: 25px;
      border-radius: 100pt;
      background-color: #fff;
      position: absolute;
      left: 25px;
      transition: left 0.3s ease;
    }
    #units-toggle.metric div {
      left: 0;
    }
    #tle-info {
      font-size: clamp(0.6rem, 1.5vw, 0.8rem);
      color: rgba(255, 255, 255, 0.7);
      margin: 0;
      text-align: center;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding-bottom: 6px;
    }
    #waitmsg {
      display: none;
      background-color: rgba(0, 0, 0, 0.75);
      text-align: center;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      font-size: 1.1rem;
      color: #fff;
      padding-top: 50px;
      box-sizing: border-box;
    }
    .modal {
      display: none;
      position: fixed;
      z-index: 100;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background-color: #fff;
      padding: 20px;
      border-radius: 5px;
      position: relative;
      width: 90%;
      max-width: 600px;
    }
    .close {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 24px;
      cursor: pointer;
      color: #333;
    }
    .close:hover {
      color: #000;
    }
    .tooltip {
      display: none;
      position: fixed;
      background-color: rgba(0, 0, 0, 0.8);
      color: #fff;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 12px;
      white-space: nowrap;
      z-index: 20;
      pointer-events: none;
    }
    .tooltip-visible {
      display: block;
    }
    .cursor-pointer {
      cursor: pointer;
    }
    .cursor-default {
      cursor: default;
    }
    iframe {
      width: 100%;
      height: 315px;
      border: none;
    }
    #fullscreen-toggle {
      cursor: pointer;
      font-size: clamp(1.2rem, 4vw, 1.5rem);
      color: #fff;
      position: absolute;
      bottom: 10px;
      right: 10px;
      z-index: 5;
    }
    @media screen and (max-width: 768px) {
      .data-label, #units-label {
        font-size: 0;
        position: relative;
        font-weight: normal;
      }
      .data-label::after, #units-label::after {
        content: attr(data-abbr);
        font-size: 0.8rem;
        color: rgba(255, 255, 255, 0.7);
        font-weight: normal;
        display: block;
      }
      #units-toggle {
        width: 40px;
        height: 20px;
      }
      #units-toggle div {
        width: 20px;
        height: 20px;
        left: 20px;
      }
      #units-toggle.metric div {
        left: 0;
      }
      #tle-info {
        display: none;
      }
      #units-section {
        display: none;
      }
    }
    @media screen and (min-width: 769px) {
      #time {
        white-space: nowrap;
      }
    }
    /* ----- visible passes drawer and pass settings sheet ----- */
    :root {
      --iss-text: #fff;
      --iss-text2: rgba(255, 255, 255, 0.72);
      --iss-text3: rgba(255, 255, 255, 0.45);
      --iss-border: rgba(255, 255, 255, 0.16);
      --iss-ok: #5dcaa5;
      --iss-info: #85b7eb;
      --iss-warn: #fac775;
      --iss-ok-bg: rgba(93, 202, 165, 0.16);
      --iss-info-bg: rgba(133, 183, 235, 0.16);
      --iss-warn-bg: rgba(250, 199, 117, 0.16);
      --iss-neutral-bg: rgba(255, 255, 255, 0.1);
    }
    #passes {
      width: 100%;
      box-sizing: border-box;
      background: #2f2f2f;
      border: 1px solid #666;
      border-top: 0;
      padding: 10px 14px 14px;
    }
    :fullscreen #passes {
      display: none;
    }
    #passes button, .ps-sheet button, .ps-sheet select {
      font-family: inherit;
      color: var(--iss-text);
      background: transparent;
      border: 1px solid var(--iss-border);
      border-radius: 8px;
      cursor: pointer;
    }
    #passes button:hover, .ps-sheet button:hover {
      background: var(--iss-neutral-bg);
    }
    #passes button:focus-visible, .ps-sheet button:focus-visible,
    .ps-sheet select:focus-visible, .ps-sheet input:focus-visible {
      outline: 2px solid var(--iss-info);
      outline-offset: 1px;
    }
    .ps-head {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    #passes #ps-toggle {
      font-size: 1.05rem;
      font-weight: 700;
      border: 0;
      padding: 6px 4px;
    }
    #ps-chevron {
      display: inline-block;
      color: var(--iss-text2);
      transition: transform 0.2s ease;
    }
    #passes.closed #ps-chevron {
      transform: rotate(-90deg);
    }
    #passes.closed #ps-body {
      display: none;
    }
    .ps-summary {
      font-size: 0.85rem;
      color: var(--iss-text2);
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ps-seg {
      display: flex;
      border: 1px solid var(--iss-border);
      border-radius: 8px;
      overflow: hidden;
    }
    #passes .ps-seg button, .ps-sheet .ps-seg button {
      border: 0;
      border-radius: 0;
      font-size: 0.85rem;
      padding: 7px 12px;
      color: var(--iss-text2);
    }
    #passes .ps-seg button.on, .ps-sheet .ps-seg button.on {
      background: var(--iss-info-bg);
      color: var(--iss-info);
    }
    .ps-sheet .ps-seg button:disabled {
      color: var(--iss-text3);
      cursor: default;
      background: transparent;
    }
    .ps-icon {
      font-size: 1.1rem;
      line-height: 1;
      padding: 6px 9px;
    }
    .ps-note {
      font-size: 0.8rem;
      color: var(--iss-text3);
      margin: 10px 0;
    }
    #ps-hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 190px;
      gap: 14px;
      align-items: center;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 14px;
    }
    #ps-hero.live {
      box-shadow: inset 0 0 0 1px var(--iss-ok);
    }
    #ps-hero.plain {
      grid-template-columns: minmax(0, 1fr);
    }
    .ps-label {
      font-size: 0.8rem;
      color: var(--iss-text3);
      margin: 0;
    }
    .ps-big {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 2px 0 6px;
    }
    .ps-sub {
      font-size: 0.85rem;
      color: var(--iss-text2);
      margin: 0 0 10px;
    }
    .ps-pills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .ps-bar {
      height: 4px;
      background: var(--iss-neutral-bg);
      border-radius: 999px;
      margin: 0 0 10px;
      overflow: hidden;
    }
    .ps-bar div {
      height: 4px;
      background: var(--iss-ok);
    }
    .ps-row {
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) 96px 44px 48px 112px minmax(0, 1fr) 150px;
      gap: 10px;
      align-items: center;
      padding: 9px 0;
      border-top: 1px solid var(--iss-border);
      font-size: 0.85rem;
    }
    .ps-row.off .ps-when, .ps-row.off .ps-num, .ps-row.off .ps-dir {
      color: var(--iss-text3);
    }
    .ps-num {
      text-align: right;
    }
    .ps-dir {
      color: var(--iss-text2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ps-status {
      text-align: right;
    }
    .ps-sheet {
      background: #2f2f2f;
      color: var(--iss-text);
      border: 1px solid #666;
      border-radius: 12px;
      padding: 18px 20px;
      width: 92%;
      max-width: 640px;
      max-height: 92vh;
      overflow-y: auto;
      box-sizing: border-box;
      position: relative;
    }
    .ps-sheet h2 {
      font-size: 1.1rem;
      margin: 0;
    }
    .ps-sheet-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .ps-sheet-head .iss-pill {
      margin-left: auto;
    }
    .ps-h {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--iss-text2);
      margin: 16px 0 8px;
    }
    .ps-q {
      display: grid;
      grid-template-columns: 20px 92px 56px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      padding: 7px 0;
      font-size: 0.85rem;
      color: var(--iss-text2);
      cursor: pointer;
    }
    .ps-q .iss-pill {
      justify-self: start;
    }
    .ps-check {
      display: flex;
      gap: 10px;
      align-items: center;
      font-size: 0.85rem;
      padding: 6px 0;
      cursor: pointer;
    }
    .ps-sheet input[type="checkbox"] {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: var(--iss-info);
    }
    .ps-sheet input[type="range"] {
      flex: 1;
      accent-color: var(--iss-info);
    }
    .ps-slider {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.8rem;
      color: var(--iss-text3);
    }
    .ps-sheet select {
      width: 100%;
      font-size: 0.85rem;
      padding: 8px 10px;
      margin-bottom: 10px;
      background: #2f2f2f;
    }
    .ps-two {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 0 22px;
    }
    #ps-status {
      font-size: 0.8rem;
      color: var(--iss-text3);
      margin: 16px 0 0;
      min-height: 1.2em;
    }
    #ps-status.bad {
      color: var(--iss-warn);
    }
    @media screen and (max-width: 768px) {
      .ps-row {
        grid-template-columns: minmax(0, 1.4fr) 92px 40px 44px 130px;
      }
      .ps-row .ps-sky, .ps-row .ps-dir {
        display: none;
      }
      #ps-hero {
        grid-template-columns: minmax(0, 1fr) 120px;
      }
      .ps-summary {
        display: none;
      }
    }
    @media screen and (max-width: 480px) {
      .ps-row {
        grid-template-columns: minmax(0, 1fr) 88px 40px;
      }
      .ps-row .ps-mag, .ps-row .ps-status {
        display: none;
      }
      .ps-head {
        gap: 6px;
      }
      #passes #ps-toggle {
        font-size: 0.95rem;
        padding: 6px 2px;
      }
      #passes .ps-seg {
        margin-left: auto;
      }
      #passes .ps-seg button {
        padding: 7px 8px;
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>
<div id="tracker-container">
    <canvas id="earthCanvas"></canvas>
    <div id="iss-tooltip" class="tooltip">Click to view live video from ISS in pop-up window</div>
    <div id="info-panel">
      <div id="primary-data">
        <div class="data-section">
          <div class="data-label" data-full="Latitude" data-abbr="Lat">Latitude</div>
          <div id="lat" class="data-value">--</div>
        </div>
        <div class="data-section">
          <div class="data-label" data-full="Longitude" data-abbr="Lon">Longitude</div>
          <div id="lon" class="data-value">--</div>
        </div>
        <div class="data-section">
          <div class="data-label" data-full="Altitude" data-abbr="Alt">Altitude</div>
          <div id="alt" class="data-value">--</div>
        </div>
        <div class="data-section">
          <div class="data-label" data-full="Speed" data-abbr="Spd">Speed</div>
          <div id="speed" class="data-value">--</div>
        </div>
        <div class="data-section">
          <div class="data-label" data-full="ISS Time" data-abbr="Time">ISS Time</div>
          <div id="time" class="data-value">--</div>
        </div>
        <div class="data-section" id="units-section">
          <div id="units-label" data-full="Metric/Imperial" data-abbr="M/I">Metric/Imperial</div>
          <div id="units-toggle">
            <div id="units-slider"></div>
          </div>
        </div>
      </div>
      <div id="fullscreen-toggle">⛶</div>
      <div id="tle-info"></div>
    </div>
    <section id="passes" hidden>
      <div class="ps-head">
        <button id="ps-toggle" aria-expanded="true" title="VISIBLE PASSES: show or hide the list of passes you can see.">Visible passes <span id="ps-chevron" aria-hidden="true">▾</span></button>
        <span id="ps-summary" class="ps-summary"></span>
        <div class="ps-seg" role="group" aria-label="Location">
          <button id="ps-home" title="HOME: predict passes for the home location set in Home Assistant.">⌂ Home</button>
          <button id="ps-device" title="THIS DEVICE: predict passes for where you are right now.">◎ This device</button>
        </div>
        <button id="ps-gear" class="ps-icon" aria-label="Pass settings" title="PASS SETTINGS: choose which passes count, for the panel and the entities alike.">⚙</button>
      </div>
      <div id="ps-body">
        <p id="ps-note" class="ps-note"></p>
        <div id="ps-hero" class="plain"></div>
        <p id="ps-count" class="ps-note"></p>
        <div id="ps-list"></div>
      </div>
    </section>
  </div>
  <div id="waitmsg">Loading ISS Track…</div>
  <div id="videoModal" class="modal">
    <div class="modal-content">
      <span class="close">×</span>
      <iframe 
        src="https://www.youtube.com/embed/awQzjn72bI0?si=NuMb4gYmPAp0D0kP"
        title="YouTube video player" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
        referrerpolicy="strict-origin-when-cross-origin" 
        allowfullscreen>
      </iframe>
    </div>
  </div>
  <div id="settingsModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="ps-sheet-title">
    <div class="ps-sheet" id="ps-sheet"></div>
  </div>

<script>
  const PI = Math.PI;
  const HALF_PI = PI * 0.5;
  const TWO_PI = PI * 2;

  let currentISS = { x: 0, y: 0, size: 50, valid: false };

  const DAYIMAGESRC = 'images/mapday.jpg';
  const NIGHTIMAGESRC = 'images/mapnight.jpg';
  const ISSIMAGESRC = 'images/iss_tiny.png';
  const SUNIMAGESRC = 'images/sun_128.png';
  const MOONIMAGESRC = 'images/moon_128.png';

  // Everything about the orbit comes from the integration. This page draws
  // the track it is given and computes no position of its own.
  let hass = null;
  let track = null;
  let trackTimer = null;
  let unitsChosen = false;
  let overlay = { observer: null, pass: null };
  const hassWaiters = [];
  const TRACK_REFRESH_MS = 5 * 60 * 1000;
  const TRACK_RETRY_MS = 15 * 1000;

  // Called by the sidebar panel that hosts this page, on every state change.
  window.issTrackSetHass = function (value) {
    const first = hass === null;
    hass = value;
    while (hassWaiters.length) hassWaiters.shift()(value);
    if (first) window.dispatchEvent(new CustomEvent('iss-track-hass'));
  };
  window.issTrackGetHass = () => hass;
  // The passes drawer tells the map whose sky to ring and which pass to mark.
  window.issTrackSetOverlay = function (value) {
    overlay = value || { observer: null, pass: null };
    if (isInitialized) drawEverything();
  };

  const canvas = document.getElementById('earthCanvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: false });
  const waitmsg = document.getElementById('waitmsg');
  const unitsToggle = document.getElementById('units-toggle');
  const fullscreenToggle = document.getElementById('fullscreen-toggle');
  const tooltip = document.getElementById('iss-tooltip');
  const videoModal = document.getElementById('videoModal');
  const modalIframe = videoModal.querySelector('iframe');
  const closeButton = document.querySelector('.close');
  const latEl = document.getElementById('lat');
  const lonEl = document.getElementById('lon');
  const altEl = document.getElementById('alt');
  const speedEl = document.getElementById('speed');
  const timeEl = document.getElementById('time');
  const tleInfo = document.getElementById('tle-info');

  let canvasWidth, canvasHeight;
  let useMetric = false;
  let dayImage = null, nightImage = null, issImage = null, sunImage = null, moonImage = null;
  let imagesLoaded = 0;

  let isInitialized = false;

  function drawSunIcon(sunLatDeg, sunLonDeg) {
    if (!sunImage) {
      console.warn("Sun image not loaded yet");
      return;
    }
    const sunPosXY = latLonToXY(sunLatDeg, sunLonDeg);
    const sunIconSize = 40;
    ctx.save();
    ctx.drawImage(sunImage, sunPosXY.x - sunIconSize / 2, sunPosXY.y - sunIconSize / 2, sunIconSize, sunIconSize);
    ctx.restore();
  }

  function drawMoonIcon(moonLatDeg, moonLonDeg) {
    if (!moonImage) {
      console.warn("Moon image not loaded yet");
      return;
    }
    const moonPosXY = latLonToXY(moonLatDeg, moonLonDeg);
    const moonIconSize = 40;
    ctx.save();
    ctx.drawImage(moonImage, moonPosXY.x - moonIconSize / 2, moonPosXY.y - moonIconSize / 2, moonIconSize, moonIconSize);
    ctx.restore();
  }

  function drawViewCircle(lat, lon, angularRadiusRad, color = 'rgba(0, 255, 0, 0.5)') {
    const numPoints = 100;
    ctx.beginPath();
    for (let i = 0; i <= numPoints; i++) {
      const theta = (i / numPoints) * TWO_PI;
      const centerLatRad = lat * PI / 180;
      const centerLonRad = lon * PI / 180;
      const pointLat = Math.asin(
        Math.sin(centerLatRad) * Math.cos(angularRadiusRad) +
        Math.cos(centerLatRad) * Math.sin(angularRadiusRad) * Math.cos(theta)
      );
      const pointLon = centerLonRad + Math.atan2(
        Math.sin(theta) * Math.sin(angularRadiusRad) * Math.cos(centerLatRad),
        Math.cos(angularRadiusRad) - Math.sin(centerLatRad) * Math.sin(pointLat)
      );
      const pointLatDeg = pointLat * 180 / PI;
      const pointLonDeg = pointLon * 180 / PI;
      const { x, y } = latLonToXY(pointLatDeg, pointLonDeg);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  function updateCanvasSize() {
    canvasWidth = canvas.clientWidth;
    canvasHeight = canvasWidth / 2;
    canvas.width = canvasWidth;
    canvas.height = canvasHeight;
  }

  function loadImages(callback) {
    dayImage = new Image();
    nightImage = new Image();
    issImage = new Image();
    sunImage = new Image();
    moonImage = new Image();

    dayImage.onload = () => {
      imagesLoaded++;
      console.log("Day image loaded");
      updateCanvasSize();
      if (!isInitialized) {
        initialRender();
      }
      if (imagesLoaded === 5) {
        console.log("All images loaded");
        callback();
      }
    };
    nightImage.onload = () => {
      imagesLoaded++;
      console.log("Night image loaded");
      if (imagesLoaded === 5) callback();
    };
    issImage.onload = () => {
      imagesLoaded++;
      console.log("ISS image loaded");
      if (imagesLoaded === 5) callback();
      else if (!isInitialized) initialRender();
    };
    sunImage.onload = () => {
      imagesLoaded++;
      console.log("Sun image loaded");
      if (imagesLoaded === 5) callback();
    };
    moonImage.onload = () => {
      imagesLoaded++;
      console.log("Moon image loaded");
      if (imagesLoaded === 5) callback();
    };

    dayImage.onerror = () => console.error("Failed to load day image");
    nightImage.onerror = () => console.error("Failed to load night image");
    issImage.onerror = () => console.error("Failed to load ISS image");
    sunImage.onerror = () => console.error("Failed to load sun image");
    moonImage.onerror = () => console.error("Failed to load Moon image");

    dayImage.src = DAYIMAGESRC;
    nightImage.src = NIGHTIMAGESRC;
    issImage.src = ISSIMAGESRC;
    sunImage.src = SUNIMAGESRC;
    moonImage.src = MOONIMAGESRC;
  }

  function whenHass() {
    return hass ? Promise.resolve(hass) : new Promise(resolve => hassWaiters.push(resolve));
  }

  // Fetch the ground track around now. It is refreshed every few minutes;
  // while a fetch fails, the last track keeps the map moving.
  async function loadTrack() {
    clearTimeout(trackTimer);
    let delay = TRACK_REFRESH_MS;
    try {
      track = await hass.callWS({ type: 'iss_track/track' });
      if (!unitsChosen) {
        useMetric = track.units === 'metric';
        unitsToggle.classList.toggle('metric', useMetric);
        unitsChosen = true;
      }
      waitmsg.style.display = 'none';
    } catch (err) {
      console.error("ISS Track data not available:", err);
      delay = TRACK_RETRY_MS;
      if (!track) {
        waitmsg.textContent = 'Waiting for ISS Track…';
        waitmsg.style.display = 'block';
      }
    }
    trackTimer = setTimeout(loadTrack, delay);
  }

  function wrapLon(lon) {
    return ((lon + 540) % 360) - 180;
  }

  function lonBetween(a, b, f) {
    return wrapLon(a + (((b - a + 540) % 360) - 180) * f);
  }

  // The station's state at a moment, read off the track by interpolation.
  function stateAt(ms) {
    if (!track) return null;
    const pos = (ms - track.start) / (track.step * 1000);
    const i = Math.floor(pos);
    if (i < 0 || i >= track.points.length - 1) return null;
    const f = pos - i;
    const a = track.points[i], b = track.points[i + 1];
    return {
      lat: a[0] + (b[0] - a[0]) * f,
      lon: lonBetween(a[1], b[1], f),
      altKm: a[2] + (b[2] - a[2]) * f,
      speedKps: a[3] + (b[3] - a[3]) * f
    };
  }

  function getCurrentISSPosition() {
    const state = stateAt(Date.now());
    if (!state) console.warn("ISS position not available yet");
    return state;
  }

  // Where the Sun is overhead, from the samples sent with the track.
  function sunAt(ms) {
    const sun = track && track.sun;
    if (!sun || sun.length < 2) return null;
    let i = 0;
    while (i < sun.length - 2 && sun[i + 1][0] <= ms) i++;
    const a = sun[i], b = sun[i + 1];
    const f = (ms - a[0]) / (b[0] - a[0]);
    return { lat: a[1] + (b[1] - a[1]) * f, lon: lonBetween(a[2], b[2], f) };
  }

  function orbitPoints(fromMs, toMs, stepMs = 60000) {
    const points = [];
    for (let t = fromMs; t <= toMs; t += stepMs) {
      const state = stateAt(t);
      if (state) points.push({ lat: state.lat, lon: state.lon });
    }
    return points;
  }

  // The observer's ring (everywhere the station is at least 10 degrees up
  // for them) and the ground track of their next matching pass.
  function drawOverlay(altKm) {
    const who = overlay.observer;
    if (who && who.latitude !== null && who.longitude !== null) {
      const ratio = 6371 / (6371 + altKm);
      const floor = 10 * PI / 180;
      const reach = Math.acos(ratio * Math.cos(floor)) - floor;
      drawViewCircle(who.latitude, who.longitude, reach, 'rgba(133, 183, 235, 0.95)');
      const { x, y } = latLonToXY(who.latitude, who.longitude);
      ctx.save();
      ctx.fillStyle = 'rgb(133, 183, 235)';
      ctx.beginPath();
      ctx.arc(x, y, 4, 0, TWO_PI);
      ctx.fill();
      ctx.restore();
    }
    const pass = overlay.pass;
    if (pass) {
      const points = orbitPoints(pass.start, pass.end, 10000);
      if (points.length > 1) drawOrbitSegments(splitDateLine(points), 'rgb(93, 202, 165)', 5);
    }
  }

  function getMoonPosition(date = new Date()) {
    if (typeof Astronomy === 'undefined') {
      console.error('Astronomy library not loaded');
      return { lat: 0, lon: 0 };
    }
    const dummyObserver = new Astronomy.Observer(0, 0, 0);
    const equ = Astronomy.Equator('Moon', date, dummyObserver, true, true);
    const ra = equ.ra;
    const dec = equ.dec;
    const gmst = Astronomy.SiderealTime(date);
    let moonLonDeg = (ra - gmst) * 15;
    while (moonLonDeg > 180) moonLonDeg -= 360;
    while (moonLonDeg < -180) moonLonDeg += 360;
    const moonLatDeg = dec;
    return { lat: moonLatDeg, lon: moonLonDeg };
  }

  function drawDayNight() {
    if (!dayImage || !nightImage) {
      console.warn("Day or night image not loaded, cannot draw terminator");
      if (dayImage) ctx.drawImage(dayImage, 0, 0, canvasWidth, canvasHeight);
      return;
    }
    ctx.drawImage(dayImage, 0, 0, canvasWidth, canvasHeight);
    const sunPos = sunAt(Date.now());
    if (!sunPos) return;
    const sunLonDeg = sunPos.lon;
    const sunLatDeg = sunPos.lat;
    const sunLonRad = sunLonDeg * PI / 180;
    const sunLatRad = sunLatDeg * PI / 180;
    const cosSunLatRad = Math.cos(Math.abs(sunLatRad));
    const sinSunLatRad = Math.sin(Math.abs(sunLatRad));
    const terminatorPoints = [];
    const NUM_SEGS = 90;
    const step = canvasWidth / NUM_SEGS;
    for (let x = -step; x <= canvasWidth + step; x += step) {
      let lonRad = XToLonRad(x);
      while (lonRad > PI) lonRad -= TWO_PI;
      while (lonRad < -PI) lonRad += TWO_PI;
      let latRad;
      if (Math.abs(lonRad - sunLonRad) === HALF_PI) {
        latRad = sunLatRad;
      } else {
        latRad = -Math.atan2(cosSunLatRad * Math.cos(lonRad - sunLonRad), sinSunLatRad);
        latRad = sunLatRad < 0 ? -latRad : latRad;
      }
      terminatorPoints.push({ x, y: LatRadToY(latRad) });
    }
    ctx.save();
    ctx.beginPath();
    if (terminatorPoints.length) {
      ctx.moveTo(terminatorPoints[0].x, terminatorPoints[0].y);
      for (let i = 1; i < terminatorPoints.length; i++) {
        ctx.lineTo(terminatorPoints[i].x, terminatorPoints[i].y);
      }
      const bottomY = sunLatDeg < 0 ? 0 : canvasHeight;
      ctx.lineTo(canvasWidth + step, bottomY);
      ctx.lineTo(-step, bottomY);
      ctx.closePath();
      ctx.clip();
    }
    ctx.drawImage(nightImage, 0, 0, canvasWidth, canvasHeight);
    ctx.restore();
    ctx.beginPath();
    ctx.rect(0, 0, canvasWidth, canvasHeight);
    ctx.clip();
    ctx.save();
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    if (terminatorPoints.length) {
      let started = false;
      for (let i = 0; i < terminatorPoints.length; i++) {
        const { x, y } = terminatorPoints[i];
        if (x >= 0 && x <= canvasWidth) {
          if (!started) {
            ctx.moveTo(x, y);
            started = true;
          } else {
            ctx.lineTo(x, y);
          }
        }
      }
      ctx.stroke();
    }
    ctx.restore();
    ctx.save();
    ctx.globalAlpha = 0.3;
    const gradientWidth = 30;
    for (let i = 0; i < terminatorPoints.length - 1; i += 2) {
      const p1 = terminatorPoints[i];
      const p2 = terminatorPoints[i + 1];
      if (p1.x < 0 || p1.x > canvasWidth || p2.x < 0 || p2.x > canvasWidth) continue;
      const dx = p2.x - p1.x;
      const dy = p2.y - p1.y;
      const steps = Math.max(1, Math.ceil(Math.hypot(dx, dy) / 4));
      for (let j = 0; j < steps; j++) {
        const t = j / steps;
        const x = p1.x + dx * t;
        const y = p1.y + dy * t;
        const gradient = ctx.createLinearGradient(x - gradientWidth / 2, y, x + gradientWidth / 2, y);
        gradient.addColorStop(0, 'rgba(0, 0, 0, 0)');
        gradient.addColorStop(1, 'rgba(0, 0, 0, 0.5)');
        ctx.fillStyle = gradient;
        ctx.fillRect(x - gradientWidth / 2, y - 2, gradientWidth, 4);
      }
    }
    ctx.restore();
    drawSunIcon(sunLatDeg, sunLonDeg);
    const moonPos = getMoonPosition();
    drawMoonIcon(moonPos.lat, moonPos.lon);
  }

  function XToLonRad(x) {
    return ((x - canvasWidth / 2) * TWO_PI / canvasWidth);
  }

  function LatRadToY(latRad) {
    return (canvasHeight * (0.5 - latRad / PI));
  }

  function latLonToXY(lat, lon) {
    const x = (lon + 180) * (canvasWidth / 360);
    const y = (90 - lat) * (canvasHeight / 180);
    return { x, y };
  }

  function splitDateLine(points) {
    if (!points.length) return [];
    const segs = [];
    let seg = [points[0]];
    for (let i = 1; i < points.length; i++) {
      const prev = points[i - 1], cur = points[i];
      if (Math.abs(cur.lon - prev.lon) > 180) {
        segs.push(seg);
        seg = [cur];
      } else {
        if (prev.lon > 150 && cur.lon < -150) {
          const t = (180 - prev.lon) / (prev.lon - (cur.lon + 360));
          const lat = prev.lat + t * (cur.lat - prev.lat);
          seg.push({ lat: lat, lon: 180 });
          segs.push(seg);
          seg = [{ lat: lat, lon: -180 }, cur];
        } else if (prev.lon < -150 && cur.lon > 150) {
          const t = (-180 - prev.lon) / (prev.lon - (cur.lon - 360));
          const lat = prev.lat + t * (cur.lat - prev.lat);
          seg.push({ lat: lat, lon: -180 });
          segs.push(seg);
          seg = [{ lat: lat, lon: 180 }, cur];
        } else {
          seg.push(cur);
        }
      }
    }
    if (seg.length) segs.push(seg);
    return segs;
  }

  function drawOrbitSegments(segments, color, width = 2) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    segments.forEach(sg => {
      if (sg.length) {
        ctx.beginPath();
        let { x, y } = latLonToXY(sg[0].lat, sg[0].lon);
        ctx.moveTo(x, y);
        for (let i = 1; i < sg.length; i++) {
          ({ x, y } = latLonToXY(sg[i].lat, sg[i].lon));
          ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
    });
    ctx.restore();
  }

  function drawISS(lat, lon) {
    if (isNaN(lat) || isNaN(lon)) {
      console.warn("Invalid lat/lon for ISS:", lat, lon);
      return;
    }
    const { x, y } = latLonToXY(lat, lon);
    const issSize = 50;
    ctx.save();
    if (issImage) {
      currentISS = { x: x, y: y, size: issSize, valid: true };
      ctx.shadowBlur = 10;
      ctx.shadowColor = 'rgba(255, 255, 255, 0.7)';
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 0;
      ctx.drawImage(issImage, x - issSize / 2, y - issSize / 2, issSize, issSize);
      ctx.shadowBlur = 0;
      ctx.shadowColor = 'transparent';
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 0;
    } else {
      console.warn("ISS image not loaded, using fallback");
      currentISS = { x: x, y: y, size: 7, valid: false };
      ctx.fillStyle = 'red';
      ctx.beginPath();
      ctx.arc(x, y, 7, 0, TWO_PI);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawLatLonGrid() {
    ctx.save();
    ctx.lineWidth = 1;
    ctx.setLineDash([5, 5]);

    for (let lat = -90; lat <= 90; lat += 30) {
      if (lat === 0) {
        ctx.strokeStyle = 'red';
      } else {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
      }
      const { x: x1, y } = latLonToXY(lat, -180);
      const { x: x2 } = latLonToXY(lat, 180);
      ctx.beginPath();
      ctx.moveTo(x1, y);
      ctx.lineTo(x2, y);
      ctx.stroke();
    }

    for (let lon = -180; lon <= 180; lon += 30) {
      if (lon === 0) {
        ctx.strokeStyle = 'blue';
      } else {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
      }
      const { x, y: y1 } = latLonToXY(90, lon);
      const { y: y2 } = latLonToXY(-90, lon);
      ctx.beginPath();
      ctx.moveTo(x, y1);
      ctx.lineTo(x, y2);
      ctx.stroke();
    }

    ctx.setLineDash([]);
    ctx.restore();
  }

  function drawInitialMap() {
    if (!dayImage) {
      console.warn("Day image not loaded, using fallback background");
      ctx.fillStyle = '#222';
      ctx.fillRect(0, 0, canvasWidth, canvasHeight);
    } else {
      ctx.drawImage(dayImage, 0, 0, canvasWidth, canvasHeight);
    }
    drawLatLonGrid();
    waitmsg.style.display = 'none';
  }

  function drawInitialISS(lat, lon) {
    if (isNaN(lat) || isNaN(lon)) {
      console.warn("Invalid lat/lon for initial ISS:", lat, lon);
      return;
    }
    drawISS(lat, lon);
  }

  function openModal() {
    videoModal.style.display = 'flex';
    const src = modalIframe.src;
    modalIframe.src = '';
    modalIframe.src = src + '&autoplay=1';
  }

  function closeModal() {
    videoModal.style.display = 'none';
    modalIframe.src = modalIframe.src.replace('&autoplay=1', '');
  }

  window.onclick = function(event) {
    if (event.target === videoModal) {
      closeModal();
    }
  };

  function setupCanvasEvents() {
    canvas.addEventListener('mousemove', function(event) {
      const rect = canvas.getBoundingClientRect();
      const mouseX = event.clientX - rect.left;
      const mouseY = event.clientY - rect.top;
      if (currentISS.valid &&
          mouseX >= currentISS.x - currentISS.size / 2 &&
          mouseX <= currentISS.x + currentISS.size / 2 &&
          mouseY >= currentISS.y - currentISS.size / 2 &&
          mouseY <= currentISS.y + currentISS.size / 2) {
        tooltip.classList.add('tooltip-visible');
        canvas.classList.add('cursor-pointer');
        canvas.classList.remove('cursor-default');
        const iconX = rect.left + currentISS.x;
        const iconY = rect.top + currentISS.y;
        const margin = 8;
        let left = iconX - tooltip.offsetWidth / 2;
        left = Math.max(margin, Math.min(left, window.innerWidth - tooltip.offsetWidth - margin));
        let top = iconY - 10;
        top = Math.max(margin, Math.min(top, window.innerHeight - tooltip.offsetHeight - margin));
        tooltip.style.left = `${left}px`;
        tooltip.style.top = `${top}px`;
      } else {
        tooltip.classList.remove('tooltip-visible');
        canvas.classList.remove('cursor-pointer');
        canvas.classList.add('cursor-default');
      }
    });

    canvas.addEventListener('click', function(event) {
      const rect = canvas.getBoundingClientRect();
      const clickX = event.clientX - rect.left;
      const clickY = event.clientY - rect.top;
      if (currentISS.valid &&
          clickX >= currentISS.x - currentISS.size / 2 &&
          clickX <= currentISS.x + currentISS.size / 2 &&
          clickY >= currentISS.y - currentISS.size / 2 &&
          clickY <= currentISS.y + currentISS.size / 2) {
        openModal();
      }
    });

    canvas.addEventListener('mouseleave', function() {
      tooltip.classList.remove('tooltip-visible');
      canvas.classList.remove('cursor-pointer');
      canvas.classList.add('cursor-default');
    });
  }

  function setupOtherEvents() {
    unitsToggle.addEventListener('click', toggleUnits);
    fullscreenToggle.addEventListener('click', toggleFullScreen);
    closeButton.addEventListener('click', closeModal);
  }

  function initialRender() {
    console.log("Starting initial render");
    drawInitialMap();
    const data = getCurrentISSPosition();
    if (data) {
      drawInitialISS(data.lat, data.lon);
      updateInfoPanel(data.lat, data.lon, data.altKm, data.speedKps);
      updateTLEInfo();
    } else {
      console.warn("No ISS position data available for initial render");
    }
  }

  function drawEverything() {
    console.log("Starting full render");
    ctx.clearRect(0, 0, canvasWidth, canvasHeight);
    drawDayNight();
    drawLatLonGrid();

    const data = getCurrentISSPosition();
    if (!data) {
      console.error("No ISS position data available for full render");
      return;
    }
    const { lat, lon, altKm, speedKps } = data;

    const periodMs = track.period_minutes * 60 * 1000;
    const nowMs = Date.now();
    const pastPts = orbitPoints(nowMs - periodMs, nowMs);
    const futurePts = orbitPoints(nowMs, nowMs + periodMs);

    drawOrbitSegments(splitDateLine(pastPts), 'white');
    drawOrbitSegments(splitDateLine(futurePts), 'yellow');
    drawOverlay(altKm);
    drawISS(lat, lon);

    const viewRadiusKm = 2000;
    const earthRadiusKm = 6371;
    const angularRadiusRad = Math.asin(viewRadiusKm / (earthRadiusKm + altKm));
    drawViewCircle(lat, lon, angularRadiusRad);

    const pastEdge = pastPts.length ? pastPts[0] : { lat, lon };
    const futureEdge = futurePts.length ? futurePts[futurePts.length - 1] : { lat, lon };
    const futureXY = latLonToXY(futureEdge.lat, futureEdge.lon);
    const pastXY = latLonToXY(pastEdge.lat, pastEdge.lon);
    const pastSegments = splitDateLine(pastPts);
    const futureSegments = splitDateLine(futurePts);
    let pastStartXY = pastXY, futureEndXY = futureXY;
    if (pastSegments.length > 0 && pastSegments[0].length > 0) {
      const firstPastPoint = pastSegments[0][0];
      pastStartXY = latLonToXY(firstPastPoint.lat, firstPastPoint.lon);
    }
    if (futureSegments.length > 0 && futureSegments[futureSegments.length - 1].length > 0) {
      const lastFuturePoint = futureSegments[futureSegments.length - 1][futureSegments[futureSegments.length - 1].length - 1];
      futureEndXY = latLonToXY(lastFuturePoint.lat, lastFuturePoint.lon);
    }
    let pastDirection = 0, futureDirection = 0;
    if (pastSegments.length > 0 && pastSegments[0].length > 1) {
      pastDirection = getOrbitDirection(pastSegments[0], 0);
    } else {
      pastDirection = Math.atan2(futureXY.y - pastXY.y, futureXY.x - pastXY.x) || 0;
    }
    if (futureSegments.length > 0) {
      const lastFutureSegment = futureSegments[futureSegments.length - 1];
      if (lastFutureSegment.length > 1) {
        futureDirection = getOrbitDirection(lastFutureSegment, lastFutureSegment.length - 1);
      }
    }

    function getOrbitDirection(segment, index) {
      if (!segment || segment.length < 2) return 0;
      if (index >= segment.length || index < 0) return 0;
      const prevIndex = Math.max(0, index - 1);
      const nextIndex = Math.min(segment.length - 1, index + 1);
      const prevPoint = latLonToXY(segment[prevIndex].lat, segment[prevIndex].lon);
      const nextPoint = latLonToXY(segment[nextIndex].lat, segment[nextIndex].lon);
      const dx = nextPoint.x - prevPoint.x;
      const dy = nextPoint.y - prevPoint.y;
      return dx === 0 && dy === 0 ? 0 : Math.atan2(dy, dx);
    }

    function drawArrow(x, y, label, color, isOutward) {
      if (isNaN(x) || isNaN(y)) return;
      ctx.save();
      ctx.fillStyle = color;
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.font = '12px Arial';
      const arrowLength = 20;
      const arrowHeadLength = 10;
      const arrowHeadWidth = 8;
      let baseAngle = isOutward ? futureDirection : pastDirection;
      const shaftEndX = x + Math.cos(baseAngle) * arrowLength;
      const shaftEndY = y + Math.sin(baseAngle) * arrowLength;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(shaftEndX, shaftEndY);
      ctx.stroke();
      const headX1 = shaftEndX - Math.cos(baseAngle) * arrowHeadLength;
      const headY1 = shaftEndY - Math.sin(baseAngle) * arrowHeadLength;
      const headX2 = headX1 + Math.sin(baseAngle) * arrowHeadWidth;
      const headY2 = headY1 - Math.cos(baseAngle) * arrowHeadWidth;
      const headX3 = headX1 - Math.sin(baseAngle) * arrowHeadWidth;
      const headY3 = headY1 + Math.cos(baseAngle) * arrowHeadWidth;
      ctx.beginPath();
      ctx.moveTo(shaftEndX, shaftEndY);
      ctx.lineTo(headX2, headY2);
      ctx.lineTo(headX3, headY3);
      ctx.closePath();
      ctx.fill();
      const labelOffset = 15;
      const verticalOffset = 5;
      if (isOutward) {
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, shaftEndX - labelOffset, shaftEndY - verticalOffset);
      } else {
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, shaftEndX + labelOffset, shaftEndY + verticalOffset);
      }
      ctx.restore();
    }

    if (!isNaN(pastStartXY.x) && !isNaN(pastStartXY.y)) {
      drawArrow(pastStartXY.x, pastStartXY.y, '-1.5h', 'white', false);
    }
    if (!isNaN(futureEndXY.x) && !isNaN(futureEndXY.y)) {
      drawArrow(futureEndXY.x, futureEndXY.y, '+1.5h', 'yellow', true);
    }

    if (track.tle && track.tle.stale) {
      ctx.save();
      ctx.translate(canvasWidth / 2, canvasHeight / 2);
      ctx.rotate(-PI / 4);
      ctx.font = '60px Arial';
      ctx.fillStyle = 'rgba(255,0,0,0.3)';
      ctx.textAlign = 'center';
      ctx.fillText('STALE TLE DATA', 0, 0);
      ctx.restore();
    }

    updateInfoPanel(lat, lon, altKm, speedKps);
    updateTLEInfo();
  }

  function updateInfoPanel(lat, lon, altKm, speedKps) {
    if (isNaN(lat) || isNaN(lon) || isNaN(altKm) || isNaN(speedKps)) {
      console.warn("Invalid data for info panel:", { lat, lon, altKm, speedKps });
      return;
    }
    const latDir = lat >= 0 ? 'N' : 'S';
    const lonDir = lon >= 0 ? 'E' : 'W';
    const latAbs = Math.abs(lat).toFixed(1);
    const lonAbs = Math.abs(lon).toFixed(1);
    const speedKmh = speedKps * 3600;
    const alt = useMetric ? `${altKm.toFixed(0)} km` : `${(altKm * 0.621371).toFixed(0)} mi`;
    const speed = useMetric ? `${speedKmh.toFixed(0)} km/h` : `${(speedKmh * 0.621371).toFixed(0)} mph`;

    const now = new Date();
    const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const month = monthNames[now.getUTCMonth()];
    const day = String(now.getUTCDate()).padStart(2, '0');
    const hours = String(now.getUTCHours()).padStart(2, '0');
    const minutes = String(now.getUTCMinutes()).padStart(2, '0');
    const seconds = String(now.getUTCSeconds()).padStart(2, '0');
    const timeText = window.innerWidth <= 768
      ? `${hours}:${minutes}:${seconds} GMT`
      : `${month} ${day}, ${hours}:${minutes}:${seconds} GMT`;

    latEl.textContent = `${latAbs}° ${latDir}`;
    lonEl.textContent = `${lonAbs}° ${lonDir}`;
    altEl.textContent = alt;
    speedEl.textContent = speed;
    timeEl.textContent = timeText;
  }

  function updateTLEInfo() {
    const tle = track && track.tle;
    if (!tle || !tle.fetched_at) {
      tleInfo.textContent = "";
      return;
    }
    const format = {
      month: '2-digit',
      day: '2-digit',
      year: 'numeric',
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit',
      hour12: true
    };
    const lastUpdate = new Date(tle.fetched_at).toLocaleString('en-US', format);
    const nextUpdate = new Date(tle.next_refresh).toLocaleString('en-US', format);
    tleInfo.textContent = `TLE updated ${lastUpdate} - Next update: ${nextUpdate} (times local)`;
  }

  let lastFrameTime = 0;
  const FRAME_INTERVAL = 5000;

  function startLoop() {
    function renderLoop(currentTime) {
      if (currentTime - lastFrameTime >= FRAME_INTERVAL) {
        drawEverything();
        lastFrameTime = currentTime;
      }
      requestAnimationFrame(renderLoop);
    }
    requestAnimationFrame(renderLoop);
  }

  function toggleUnits() {
    useMetric = !useMetric;
    unitsChosen = true;
    unitsToggle.classList.toggle('metric');
    drawEverything();
  }

  function toggleFullScreen() {
    if (!document.fullscreenElement) {
      const el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      else if (el.msRequestFullscreen) el.msRequestFullscreen();
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      else if (document.msExitFullscreen) document.msExitFullscreen();
    }
  }

  async function init() {
    try {
      updateCanvasSize();
      setupCanvasEvents();
      setupOtherEvents();
      waitmsg.style.display = 'block';
      await new Promise(res => loadImages(res));
      // Opened on its own, outside the sidebar panel, there is no connection.
      const lonely = setTimeout(() => {
        if (!hass) waitmsg.textContent = 'Open ISS Track from the Home Assistant sidebar.';
      }, 4000);
      await whenHass();
      clearTimeout(lonely);
      await loadTrack();
      while (!track) await new Promise(res => setTimeout(res, 500));
      initialRender();
      isInitialized = true;
      drawEverything();
      startLoop();
    } catch (err) {
      console.error("Init error:", err);
    }
  }

  window.addEventListener('load', init);

  let resizeTimeout;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => {
      updateCanvasSize();
      drawEverything();
    }, 100);
  });

  document.addEventListener('fullscreenchange', () => {
    updateCanvasSize();
    drawEverything();
  });
</script>
<script type="module">
  // The visible passes drawer and the pass settings sheet. Labels, pills and
  // the sky dome come from the shared module the dashboard card also uses.
  const query = new URLSearchParams(window.location.search);
  const S = await import(`./iss-track-shared.js?v=${query.get('v') || ''}`);

  const sharedStyle = document.createElement('style');
  sharedStyle.textContent = S.SHARED_CSS;
  document.head.append(sharedStyle);

  const $ = (id) => document.getElementById(id);
  const remember = {
    get(key, fallback) {
      try { return window.localStorage.getItem(key) ?? fallback; } catch (err) { return fallback; }
    },
    set(key, value) {
      try { window.localStorage.setItem(key, value); } catch (err) { /* private mode */ }
    },
  };

  const PASSES_REFRESH_MS = 5 * 60 * 1000;
  const REASON = {
    quality: (p) => `${S.QUALITY[p.quality].label} is off`,
    brightness: () => 'Too faint',
    period: (p) => (p.period === 'morning' ? 'Morning is off' : 'Evening is off'),
  };

  let choice = remember.get('iss_track_observer', 'home') === 'device' ? 'device' : 'home';
  let open = remember.get('iss_track_passes_open', '1') === '1';
  let data = null;
  let failure = null;
  let loading = false;
  let signature = '';
  let settings = null;
  let pending = {};
  let saveTimer = null;

  const hass = () => window.issTrackGetHass();

  function stateOf(now) {
    if (!data) return { kind: failure ? 'error' : 'loading' };
    if (!data.observer.available) return { kind: 'unavailable' };
    const next = S.nextMatching(data.passes, now);
    if (!next) return { kind: 'none' };
    return { kind: S.isLive(next, now) ? 'live' : 'next', pass: next };
  }

  async function load() {
    if (!hass() || loading) return;
    loading = true;
    try {
      data = await S.fetchPasses(hass(), choice);
      failure = null;
    } catch (err) {
      failure = (err && err.message) || 'ISS Track is not ready';
    }
    loading = false;
    render();
  }

  function statusPill(p) {
    if (!p.matches) {
      return S.pill('dim', REASON[p.reason](p), 'LEFT OUT: this pass is outside your pass settings.');
    }
    if (!p.alert) {
      return S.pill('dim', 'Skipped, too cloudy', 'SKIPPED: the forecast is cloudier than your sky setting allows.');
    }
    return S.pill('on', 'Alert on', 'ALERT ON: this pass matches your settings, so alerts and the entities include it.');
  }

  function renderHead(state, now) {
    $('passes').classList.toggle('closed', !open);
    $('ps-toggle').setAttribute('aria-expanded', String(open));
    $('ps-home').classList.toggle('on', choice === 'home');
    $('ps-device').classList.toggle('on', choice === 'device');
    let summary = '';
    if (state.kind === 'next') {
      const when = S.formatWhen(state.pass.start, hass(), now);
      summary = `Next: ${when.day} at ${when.time}, ${S.QUALITY[state.pass.quality].label}`;
    } else if (state.kind === 'live') {
      summary = 'A pass is visible now';
    } else if (state.kind === 'none') {
      summary = 'No matching passes for 10 days';
    }
    $('ps-summary').textContent = open ? '' : summary;
  }

  function renderNote() {
    let note = '';
    if (data && data.observer.available) {
      const who = data.observer;
      if (who.source === 'home') note = 'Using the home location from Home Assistant settings';
      else if (who.source === 'browser') note = "Using this browser's location, rounded to about a kilometre";
      else note = `Using ${who.name}'s location from Home Assistant`;
    }
    $('ps-note').textContent = note;
  }

  function renderHero(state, now) {
    const hero = $('ps-hero');
    hero.className = state.kind === 'live' ? 'live' : (state.kind === 'next' ? '' : 'plain');
    if (state.kind === 'loading') {
      hero.innerHTML = '<p class="ps-sub" style="margin:0">Loading passes…</p>';
    } else if (state.kind === 'error') {
      hero.innerHTML = `<div><p class="ps-big">Passes aren't available</p><p class="ps-sub" style="margin:0">${S.escapeHtml(failure)}</p></div>`;
    } else if (state.kind === 'unavailable') {
      hero.innerHTML = `<div><p class="ps-big">No location for this device</p><p class="ps-sub" style="margin:0">${S.escapeHtml(S.unavailableText(data.observer))}</p></div>`;
    } else if (state.kind === 'none') {
      const other = S.bestOther(data.passes, now);
      let hint = 'There are no visible passes at all in that time.';
      if (other) {
        const when = S.formatWhen(other.start, hass(), now);
        hint = `The best one coming is ${S.QUALITY[other.quality].label}, ${Math.round(other.peak_elevation)}°, ${when.day} at ${when.time}.`;
      }
      hero.innerHTML = `<div><p class="ps-big">No matching passes for 10 days</p><p class="ps-sub">${S.escapeHtml(hint)}</p>`
        + '<button id="ps-adjust" style="font-size:0.85rem;padding:7px 12px" title="PASS SETTINGS: change which passes count.">Adjust pass settings</button></div>';
      $('ps-adjust').addEventListener('click', openSettings);
    } else if (state.kind === 'live') {
      const p = state.pass;
      hero.innerHTML = '<div><p class="ps-label">Visible now</p><p class="ps-big" id="ps-big"></p>'
        + '<p class="ps-sub" id="ps-sub"></p><div class="ps-bar"><div id="ps-bar" style="width:0%"></div></div>'
        + `<p class="ps-sub" style="margin:0"><b id="ps-left" style="color:var(--iss-text)"></b> · peaks at ${Math.round(p.peak_elevation)}°, ${S.escapeHtml(S.describePass(p).split(', ')[1])}</p></div>`
        + '<div id="ps-dome"></div>';
      updateLive(p, now);
    } else {
      const p = state.pass;
      const when = S.formatWhen(p.start, hass(), now);
      hero.innerHTML = '<div><p class="ps-label">Next pass that matches</p>'
        + `<p class="ps-big" id="ps-big">${S.escapeHtml(S.formatCountdown(Date.parse(p.start) - now))}</p>`
        + `<p class="ps-sub">${S.escapeHtml(`${when.day} at ${when.time}, visible for ${S.formatDuration(p.duration_seconds)}. ${S.describePass(p)}.`)}</p>`
        + `<div class="ps-pills">${S.qualityPill(p)}${S.magnitudePill(p)}${S.skyPill(p)}</div></div>`
        + `<div>${S.domeSvg(p)}</div>`;
    }
  }

  function updateLive(p, now) {
    const look = S.liveLook(p, now);
    if (!look || !$('ps-big')) return;
    $('ps-big').textContent = `Look ${look.direction}`;
    $('ps-sub').textContent = `${Math.round(look.elevation)}° above the horizon`;
    $('ps-bar').style.width = `${Math.round(look.progress * 100)}%`;
    $('ps-left').textContent = `${S.formatDuration(look.secondsLeft)} left`;
    $('ps-dome').innerHTML = S.domeSvg(p, look.progress);
  }

  function renderList(now) {
    const list = $('ps-list');
    const count = $('ps-count');
    if (!data || !data.observer.available) {
      list.innerHTML = '';
      count.textContent = '';
      return;
    }
    const rows = data.passes.filter((p) => Date.parse(p.end) >= now);
    const matching = rows.filter((p) => p.matches).length;
    count.textContent = rows.length
      ? `${matching} of ${rows.length} visible passes in the next 10 days match your settings`
      : 'No visible passes in the next 10 days';
    list.innerHTML = rows.map((p) => {
      const when = S.formatWhen(p.start, hass(), now);
      return `<div class="ps-row${p.matches ? '' : ' off'}">`
        + `<span class="ps-when" title="${S.escapeHtml(S.describePass(p))}">${S.escapeHtml(`${when.day} · ${when.time}`)}</span>`
        + `<span>${S.qualityPill(p, false)}</span>`
        + `<span class="ps-num" title="HIGHEST POINT: degrees above the horizon while visible.">${Math.round(p.peak_elevation)}°</span>`
        + `<span class="ps-num ps-mag" title="BRIGHTNESS: estimated magnitude. Lower is brighter.">${S.formatMagnitude(p.magnitude)}</span>`
        + `<span class="ps-sky">${S.skyPill(p)}</span>`
        + `<span class="ps-dir">${S.escapeHtml(`${p.start_direction} to ${p.end_direction}`)}</span>`
        + `<span class="ps-status">${statusPill(p)}</span></div>`;
    }).join('');
  }

  function pushOverlay(state) {
    const who = data && data.observer.available ? data.observer : null;
    const p = state.pass || null;
    window.issTrackSetOverlay({
      observer: who ? { latitude: who.latitude, longitude: who.longitude } : null,
      pass: p ? { start: Date.parse(p.start), end: Date.parse(p.end) } : null,
    });
  }

  function render() {
    const now = Date.now();
    const state = stateOf(now);
    signature = `${state.kind}|${state.pass ? state.pass.start : ''}`;
    $('passes').hidden = false;
    renderHead(state, now);
    renderNote();
    renderHero(state, now);
    renderList(now);
    pushOverlay(state);
  }

  function tick() {
    if (!data) return;
    const now = Date.now();
    const state = stateOf(now);
    if (`${state.kind}|${state.pass ? state.pass.start : ''}` !== signature) {
      render();
    } else if (state.kind === 'next' && $('ps-big')) {
      $('ps-big').textContent = S.formatCountdown(Date.parse(state.pass.start) - now);
    } else if (state.kind === 'live') {
      updateLive(state.pass, now);
    }
  }

  // ----- pass settings sheet -------------------------------------------

  function sheetHtml() {
    const s = settings;
    const lock = s.can_edit ? '' : ' disabled';
    const qualities = S.QUALITY_ORDER.map((key) => {
      const q = S.QUALITY[key];
      return `<label class="ps-q"><input type="checkbox" data-quality="${key}"${s.qualities.includes(key) ? ' checked' : ''}${lock}/>`
        + `${S.pill(key, q.label)}<span>${q.range}</span><span>${q.hint}</span></label>`;
    }).join('');
    const weather = ['<option value="">No weather entity</option>'].concat(
      s.weather_entities.map((w) => `<option value="${S.escapeHtml(w.entity_id)}"${w.entity_id === s.weather_entity ? ' selected' : ''}>${S.escapeHtml(w.name)}</option>`),
    ).join('');
    const sky = S.SKY_LIMITS.map(([key, label]) => (
      `<button data-sky="${key}" class="${s.sky_limit === key ? 'on' : ''}"${s.can_edit && s.weather_entity ? '' : ' disabled'}>${label}</button>`
    )).join('');
    const slider = Math.round((S.MAGNITUDE_FAINTEST - s.faintest_magnitude) / S.MAGNITUDE_STEP);
    const steps = Math.round((S.MAGNITUDE_FAINTEST - S.MAGNITUDE_BRIGHTEST) / S.MAGNITUDE_STEP);
    return '<div class="ps-sheet-head"><h2 id="ps-sheet-title">Pass settings</h2>'
      + `${S.pill('neutral', 'Shared by the panel and the entities', 'ONE SETTING: the map panel, dashboard card, calendar and entities all use these.')}`
      + '<button id="ps-close" class="ps-icon" aria-label="Close" title="CLOSE: changes are saved as you make them.">×</button></div>'
      + '<p class="ps-h" style="margin-top:0">Pass quality to include</p>' + qualities
      + '<p class="ps-h">Minimum brightness</p>'
      + `<div class="ps-slider"><span>Dimmer</span><input type="range" id="ps-mag" min="0" max="${steps}" step="1" value="${slider}" aria-label="Minimum brightness" title="MINIMUM BRIGHTNESS: leave out passes fainter than this."${lock}/><span>Brighter</span></div>`
      + '<p style="font-size:0.85rem;margin:8px 0 0"><b id="ps-mag-out"></b> <span id="ps-mag-hint" style="color:var(--iss-text2)"></span></p>'
      + '<p class="ps-note" style="margin:8px 0 0">Magnitude runs backwards: a lower number is brighter. Brightness is an estimate.</p>'
      + '<div class="ps-two"><div><p class="ps-h">Sky forecast</p>'
      + `<select id="ps-weather" aria-label="Weather entity" title="WEATHER ENTITY: where the sky forecast for each pass comes from."${lock}>${weather}</select>`
      + '<p class="ps-note" style="margin:0 0 6px">Alert me when the sky is</p>'
      + `<div class="ps-seg" id="ps-sky" title="SKY LIMIT: alerts skip a pass when the forecast is cloudier than this. A pass with no forecast is never skipped.">${sky}</div></div>`
      + '<div><p class="ps-h">Time of day</p>'
      + `<label class="ps-check"><input type="checkbox" id="ps-evening"${s.evening ? ' checked' : ''}${lock}/>Evening passes, after sunset</label>`
      + `<label class="ps-check"><input type="checkbox" id="ps-morning"${s.morning ? ' checked' : ''}${lock}/>Morning passes, before sunrise</label>`
      + '<p class="ps-note" style="margin:6px 0 0">About half of all visible passes happen before dawn.</p></div></div>'
      + `<p id="ps-status">${s.can_edit ? 'Changes are saved as you make them.' : 'Only an administrator can change pass settings.'}</p>`;
  }

  function showMagnitude() {
    const limit = S.MAGNITUDE_FAINTEST - Number($('ps-mag').value) * S.MAGNITUDE_STEP;
    $('ps-mag-out').textContent = `Magnitude ${S.formatMagnitude(limit)} or brighter`;
    $('ps-mag-hint').textContent = `· ${S.magnitudeHint(limit)}`;
    return limit;
  }

  function setStatus(text, bad = false) {
    const status = $('ps-status');
    if (!status) return;
    status.textContent = text;
    status.classList.toggle('bad', bad);
  }

  function queueSave(patch) {
    Object.assign(pending, patch);
    setStatus('Saving…');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(save, 350);
  }

  async function save() {
    const patch = pending;
    pending = {};
    try {
      settings = await hass().callWS({ type: 'iss_track/settings/set', ...patch });
      setStatus('Saved');
      // The sky buttons only work once a weather entity is chosen.
      for (const button of $('ps-sky').querySelectorAll('button')) {
        button.disabled = !settings.weather_entity;
        button.classList.toggle('on', button.dataset.sky === settings.sky_limit);
      }
      await load();
    } catch (err) {
      settings = await hass().callWS({ type: 'iss_track/settings/get' });
      buildSheet();
      setStatus(`Couldn't save: ${(err && err.message) || 'unknown error'}`, true);
    }
  }

  function buildSheet() {
    $('ps-sheet').innerHTML = sheetHtml();
    showMagnitude();
    $('ps-close').addEventListener('click', closeSettings);
    for (const box of $('ps-sheet').querySelectorAll('input[data-quality]')) {
      box.addEventListener('change', () => {
        const chosen = [...$('ps-sheet').querySelectorAll('input[data-quality]:checked')].map((b) => b.dataset.quality);
        if (!chosen.length) {
          box.checked = true;
          setStatus('Keep at least one pass quality.', true);
          return;
        }
        queueSave({ qualities: chosen });
      });
    }
    $('ps-mag').addEventListener('input', showMagnitude);
    $('ps-mag').addEventListener('change', () => queueSave({ faintest_magnitude: showMagnitude() }));
    $('ps-weather').addEventListener('change', (event) => queueSave({ weather_entity: event.target.value || null }));
    $('ps-sky').addEventListener('click', (event) => {
      const button = event.target.closest('button');
      if (!button || button.disabled) return;
      for (const other of $('ps-sky').querySelectorAll('button')) other.classList.toggle('on', other === button);
      queueSave({ sky_limit: button.dataset.sky });
    });
    for (const id of ['ps-evening', 'ps-morning']) {
      $(id).addEventListener('change', (event) => {
        if (!$('ps-evening').checked && !$('ps-morning').checked) {
          event.target.checked = true;
          setStatus('Keep evening passes, morning passes, or both.', true);
          return;
        }
        queueSave({ evening: $('ps-evening').checked, morning: $('ps-morning').checked });
      });
    }
  }

  async function openSettings() {
    if (!hass()) return;
    try {
      settings = await hass().callWS({ type: 'iss_track/settings/get' });
    } catch (err) {
      return;
    }
    buildSheet();
    $('settingsModal').style.display = 'flex';
    $('ps-close').focus();
  }

  function closeSettings() {
    $('settingsModal').style.display = 'none';
    $('ps-gear').focus();
  }

  // ----- wiring ---------------------------------------------------------

  $('ps-toggle').addEventListener('click', () => {
    open = !open;
    remember.set('iss_track_passes_open', open ? '1' : '0');
    render();
  });
  for (const [id, value] of [['ps-home', 'home'], ['ps-device', 'device']]) {
    $(id).addEventListener('click', () => {
      if (choice === value) return;
      choice = value;
      remember.set('iss_track_observer', value);
      data = null;
      render();
      load();
    });
  }
  $('ps-gear').addEventListener('click', openSettings);
  $('settingsModal').addEventListener('click', (event) => {
    if (event.target === $('settingsModal')) closeSettings();
  });
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && $('settingsModal').style.display === 'flex') closeSettings();
  });

  async function start() {
    render();
    await load();
    if (query.has('settings')) openSettings();
    window.setInterval(tick, 1000);
    window.setInterval(load, PASSES_REFRESH_MS);
  }
  if (hass()) start();
  else window.addEventListener('iss-track-hass', start, { once: true });
</script>
